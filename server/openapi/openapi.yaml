openapi: 3.1.0
info:
  title: Dojo Kenpo Porto Alto API
  version: 1.0.0
  description: >-
    Only GET /health and GET /admin-test are implemented. All content operations below are planned contracts
    only. API properties are camelCase and map to the real Supabase snake_case columns as documented in
    server/docs/data-model.md.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Runtime
  - name: Public content
  - name: Admin content
paths:
  /health:
    get:
      tags:
        - Runtime
      operationId: getHealth
      x-implementation-status: implemented-and-tested
      responses:
        '200':
          description: Process health only; does not test Supabase availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin-test:
    get:
      tags:
        - Runtime
      operationId: getAdminTest
      x-implementation-status: implemented-temporary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Temporary authentication diagnostic; not a dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTestEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /site-config:
    get:
      tags:
        - Public content
      operationId: getPublicSiteConfig
      x-implementation-status: planned
      responses:
        '200':
          description: Only rows where is_public is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteConfigListEnvelope'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /classes:
    get:
      tags:
        - Public content
      operationId: listPublicClasses
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - sortOrder
              - title
              - publishedAt
          description: Allowed sort key for this resource.
      responses:
        '200':
          description: Published, not-yet-expired classes only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassListEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /classes/{classId}/sessions:
    get:
      tags:
        - Public content
      operationId: listPublicClassSessions
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: >-
            Published valid recurring sessions with published exceptions in the requested date window; draft,
            expired and archived records are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSessionListEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /gallery:
    get:
      tags:
        - Public content
      operationId: listPublicMedia
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - sortOrder
              - title
              - publishedAt
          description: Allowed sort key for this resource.
      responses:
        '200':
          description: >-
            Published media_assets only. A separate gallery editorial table is not present in the supplied
            schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /contact:
    post:
      tags:
        - Public content
      operationId: submitContactMessage
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: >-
            Planned acceptance response. Persistence and retention require approval; no response body is
            defined until that behavior is approved.
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/site-config:
    get:
      tags:
        - Admin content
      operationId: listSiteConfig
      x-implementation-status: planned
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/SiteConfigList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Admin content
      operationId: createSiteConfig
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteConfigCreate'
      responses:
        '201':
          description: Created key/value configuration record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteConfigSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/site-config/{id}:
    patch:
      tags:
        - Admin content
      operationId: updateSiteConfig
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteConfigPatch'
      responses:
        '200':
          description: Updated key/value configuration record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteConfigSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/classes:
    post:
      tags:
        - Admin content
      operationId: createClass
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreate'
      responses:
        '201':
          description: Created class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/classes/{classId}:
    patch:
      tags:
        - Admin content
      operationId: updateClass
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassPatch'
      responses:
        '200':
          description: Updated class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/classes/{classId}/sessions:
    post:
      tags:
        - Admin content
      operationId: createClassSession
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassSessionCreate'
      responses:
        '201':
          description: Created recurring class session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassSessionSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/schedule-exceptions:
    post:
      tags:
        - Admin content
      operationId: createScheduleException
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleExceptionCreate'
      responses:
        '201':
          description: Created schedule exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleExceptionSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/media-assets:
    get:
      tags:
        - Admin content
      operationId: listMediaAssets
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - sortOrder
              - title
              - publishedAt
              - createdAt
          description: Allowed sort key for this resource.
      responses:
        '200':
          $ref: '#/components/responses/MediaList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/contact-messages:
    get:
      tags:
        - Admin content
      operationId: listContactMessages
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Order'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - status
          description: Allowed sort key for this resource.
      responses:
        '200':
          description: Stored messages; endpoint remains planned and requires an approved persistence/access policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageListEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /admin/media-assets/{assetId}:
    patch:
      tags:
        - Admin content
      operationId: updateMediaMetadata
      x-implementation-status: planned
      description: >-
        Metadata editing only. Upload, file replacement and deletion are deliberately not specified pending
        Storage authorization and lifecycle design.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPatch'
      responses:
        '200':
          description: Updated media metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSuccessEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClassId:
      name: classId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Resource-specific allowlist; see the enum on each operation.
  responses:
    Error:
      description: Normalized API error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SiteConfigList:
      description: Configuration rows.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiteConfigListEnvelope'
    MediaList:
      description: Media metadata records.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaListEnvelope'
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
      required:
        - requestId
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - error
        - meta
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: ok
          required:
            - status
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta
    AdminTestEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: authenticated
            role:
              type: string
              enum:
                - owner
                - admin
            userId:
              type: string
              format: uuid
          required:
            - status
            - role
            - userId
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta
    PublicationStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    ContactStatus:
      type: string
      enum:
        - new
        - read
        - replied
        - archived
    AdminRole:
      type: string
      enum:
        - owner
        - admin
    MediaType:
      type: string
      enum:
        - image
        - video
    ClassFields:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
        targetAudience:
          type:
            - string
            - 'null'
        location:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        sortOrder:
          type: integer
          minimum: 0
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdBy:
          type:
            - string
            - 'null'
          format: uuid
          readOnly: true
        updatedBy:
          type:
            - string
            - 'null'
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: >-
        API representation of classes. expiresAt must be later than publishedAt when both are set; this
        cross-field rule must be validated by the application. API slug is supplied explicitly; automatic
        generation is undecided.
    ClassCreate:
      type: object
      additionalProperties: false
      description: >-
        slug is supplied explicitly; automatic slug generation is undecided. When both are set, expiresAt must
        be later than publishedAt; the application must validate this cross-field rule.
      properties:
        slug:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
        targetAudience:
          type:
            - string
            - 'null'
        location:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        sortOrder:
          type: integer
          minimum: 0
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - slug
        - title
    ClassPatch:
      type: object
      additionalProperties: false
      description: >-
        Supply at least one writable property. Cross-field publication-window validation must use the
        persisted record merged with this patch.
      properties:
        slug:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
        targetAudience:
          type:
            - string
            - 'null'
        location:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        sortOrder:
          type: integer
          minimum: 0
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
      minProperties: 1
    ClassListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassFields'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta
    ClassSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 'ISO weekday numbering: Monday is 1 and Sunday is 7.'
          Monday=1 through Sunday=7.: null
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
        timezone:
          type: string
          default: Europe/Lisbon
          description: IANA time-zone identifier; validity must be checked by the application.
        location:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        validFrom:
          type:
            - string
            - 'null'
          format: date
        validUntil:
          type:
            - string
            - 'null'
          format: date
        sortOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - classId
        - weekday
        - startTime
        - endTime
        - timezone
        - status
        - sortOrder
        - createdAt
        - updatedAt
    ClassSessionCreate:
      type: object
      additionalProperties: false
      properties:
        classId:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
        timezone:
          type: string
          default: Europe/Lisbon
          description: IANA time-zone identifier; validity must be checked by the application.
        location:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        validFrom:
          type:
            - string
            - 'null'
          format: date
        validUntil:
          type:
            - string
            - 'null'
          format: date
        sortOrder:
          type: integer
          minimum: 0
      required:
        - classId
        - weekday
        - startTime
        - endTime
      description: >-
        Times use HH:mm:ss with optional fractional seconds. The application must validate that endTime is
        later than startTime, validUntil is not earlier than validFrom, and timezone is a valid IANA time-zone
        identifier.
    ClassSessionListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/ClassSession'
            exceptions:
              type: array
              items:
                $ref: '#/components/schemas/ScheduleException'
          required:
            - sessions
            - exceptions
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta
    ScheduleException:
      type: object
      properties:
        id:
          type: string
          format: uuid
        classSessionId:
          type: string
          format: uuid
        exceptionDate:
          type: string
          format: date
        exceptionType:
          type: string
          enum:
            - cancelled
            - modified
        replacementStartTime:
          type:
            - string
            - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
          description: HH:mm:ss with optional fractional seconds; conditional on exceptionType.
        replacementEndTime:
          type:
            - string
            - 'null'
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
          description: HH:mm:ss with optional fractional seconds; conditional on exceptionType.
        replacementLocation:
          type:
            - string
            - 'null'
        publicNote:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - classSessionId
        - exceptionDate
        - exceptionType
        - status
        - createdAt
        - updatedAt
    ScheduleExceptionCreate:
      oneOf:
        - type: object
          properties:
            classSessionId:
              type: string
              format: uuid
            exceptionDate:
              type: string
              format: date
            exceptionType:
              type: string
              const: cancelled
            replacementStartTime:
              type: 'null'
            replacementEndTime:
              type: 'null'
            replacementLocation:
              type:
                - string
                - 'null'
            publicNote:
              type:
                - string
                - 'null'
          required:
            - classSessionId
            - exceptionDate
            - exceptionType
          additionalProperties: false
          description: 'Cancelled: replacement times must be absent or null.'
        - type: object
          properties:
            classSessionId:
              type: string
              format: uuid
            exceptionDate:
              type: string
              format: date
            exceptionType:
              type: string
              const: modified
            replacementStartTime:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
            replacementEndTime:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,6})?$
            replacementLocation:
              type:
                - string
                - 'null'
            publicNote:
              type:
                - string
                - 'null'
          required:
            - classSessionId
            - exceptionDate
            - exceptionType
            - replacementStartTime
            - replacementEndTime
          additionalProperties: false
          description: >-
            Modified: both replacement times are required and replacementEndTime must be later than
            replacementStartTime; the application must enforce the cross-field order.
      description: Only the declared properties are accepted. Cross-field time ordering is validated by the application.
    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bucketId:
          type: string
          const: dojo-media
        storagePath:
          type: string
        mediaType:
          $ref: '#/components/schemas/MediaType'
        originalFilename:
          type:
            - string
            - 'null'
        title:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        altText:
          type:
            - string
            - 'null'
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - video/mp4
            - video/webm
            - video/quicktime
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 104857600
        width:
          type:
            - integer
            - 'null'
          minimum: 1
        height:
          type:
            - integer
            - 'null'
          minimum: 1
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        status:
          $ref: '#/components/schemas/PublicationStatus'
        sortOrder:
          type: integer
          minimum: 0
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        uploadedBy:
          type:
            - string
            - 'null'
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - bucketId
        - storagePath
        - mediaType
        - mimeType
        - sizeBytes
        - status
        - sortOrder
        - createdAt
        - updatedAt
      description: >-
        Media metadata record. mediaType=image requires an image/* MIME from the allowed enum; mediaType=video
        requires a video/* MIME. The application must enforce this relationship. Storage bucket limit is
        104857600 bytes (100 MiB).
      allOf:
        - if:
            properties:
              mediaType:
                const: image
            required:
              - mediaType
          then:
            properties:
              mimeType:
                enum:
                  - image/jpeg
                  - image/png
                  - image/webp
                  - image/gif
        - if:
            properties:
              mediaType:
                const: video
            required:
              - mediaType
          then:
            properties:
              mimeType:
                enum:
                  - video/mp4
                  - video/webm
                  - video/quicktime
